name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './climate-sv/package-lock.json'
          
      - name: Install dependencies
        working-directory: ./climate-sv
        run: npm ci
        
      - name: Build SvelteKit
        working-directory: ./climate-sv
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          export PUBLIC_FIREBASE_API_KEY=$(echo "$FIREBASE_CONFIG" | jq -r .apiKey)
          export PUBLIC_FIREBASE_AUTH_DOMAIN=$(echo "$FIREBASE_CONFIG" | jq -r .authDomain)
          export PUBLIC_FIREBASE_PROJECT_ID=$(echo "$FIREBASE_CONFIG" | jq -r .projectId)
          export PUBLIC_FIREBASE_STORAGE_BUCKET=$(echo "$FIREBASE_CONFIG" | jq -r .storageBucket)
          export PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$(echo "$FIREBASE_CONFIG" | jq -r .messagingSenderId)
          export PUBLIC_FIREBASE_APP_ID=$(echo "$FIREBASE_CONFIG" | jq -r .appId)
          BASE_PATH=/${{ github.event.repository.name }} npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './climate-sv/build'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

      
permissions:
  contents: write
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create Firebase Config
        shell: bash
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          mkdir -p scripts
          echo "window.FIREBASE_CONFIG = $FIREBASE_CONFIG_JSON;" > scripts/firebase-config.js
          touch .nojekyll

      - name: Prepare Workspace
        run: rm .gitignore
